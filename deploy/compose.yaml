# Definition of billing-service for Docker Compose; keep it self-contained.
# On each release the deploy workflow checks it and copies it into cadenway-ops, as
# environments/<env>/services/billing-service.yaml for the environment it deploys to.
#
# Internal service: no Traefik label, no published port. Secret values (the database URLs and the
# NATS password) are referenced by name; they live in cadenway-ops, which documents every variable
# below in docs/service-environment.md. A variable added here must exist on the host before the
# release that reads it: the GitOps agent refuses a commit that leaves one unset.
#
# The API gateway has its existing issuer binding. Public keys for the two quota owners are
# optional and allow only the signed entitlement reader after they have been provisioned.
#
# MIGRATION_DATABASE_URL is deliberately absent: the GitOps agent of cadenway-ops hands the
# migrator's URL to the one-off migration container only (docs/database.md there), so the running
# service never holds the owner credentials of its schema.
services:
  billing-service:
    image: ghcr.io/${GHCR_OWNER}/cadenway-billing-service:${BILLING_SERVICE_VERSION}
    restart: unless-stopped
    environment:
      PORT: '3012'
      DATABASE_URL: ${BILLING_SERVICE_DATABASE_URL}
      NATS_URL: ${NATS_URL}
      NATS_USER: billing
      NATS_PASSWORD: ${BILLING_NATS_PASSWORD}
      BILLING_USAGE_ENABLED: ${BILLING_USAGE_ENABLED:-false}
      ORGANIZATION_SERVICE_URL: ${BILLING_ORGANIZATION_SERVICE_URL:-}
      STORAGE_SERVICE_URL: ${BILLING_STORAGE_SERVICE_URL:-}
      INTERNAL_TOKEN_PRIVATE_JWK: ${BILLING_SERVICE_INTERNAL_TOKEN_PRIVATE_JWK:-}
      INTERNAL_TOKEN_AUDIENCE: billing-service
      ORGANIZATION_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS: ${ORGANIZATION_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS:-}
      STORAGE_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS: ${STORAGE_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS:-}
      INTERNAL_TOKEN_TRUSTED_ISSUERS: >-
        {"api-gateway": [${API_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}]}
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3012/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

# Declared identically by cadenway-ops and by every service definition it includes.
networks:
  internal: {}
